<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1a2e">
<title>Radar Vocale LG</title>
<style>
:root{--bg1:#07121f;--bg2:#0b2a44;--bg3:#0b6e7a;--card:#ffffff;--fg:#0f2a33;--mut:#5b7076;--acc:#0b6e7a;--acc2:#3fb6c4;--rec:#c62828;--ok:#2e7d32;--line:#d5e2e6;--hi:#e8f4f6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--fg);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif;
background:radial-gradient(120% 60% at 50% 0%,#12385a 0%,rgba(18,56,90,0) 60%),linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 140%);background-attachment:fixed}
.w{max-width:600px;margin:0 auto;padding:14px max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left));display:grid;gap:14px}
header{color:#fff;display:flex;align-items:center;gap:12px;padding:6px 2px}
.logo{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:radial-gradient(circle,#3fb6c4 0%,#0b6e7a 60%,#0b2a44 100%);box-shadow:0 0 18px rgba(63,182,196,.55)}
h1{font-size:21px;margin:0;letter-spacing:.06em}.sub{color:#9fd3da;font-size:13px}
.card{background:var(--card);border-radius:16px;padding:16px;display:grid;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
label{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{width:100%;font:16px inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:#f7fbfc;color:var(--fg)}
textarea{min-height:90px}
button{font:600 16px system-ui,sans-serif;border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:#fff;cursor:pointer}
button.g{background:#fff;color:var(--fg);border:1px solid var(--line)}button:disabled{opacity:.5}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.12);padding:5px;border-radius:12px}
.tabs button{flex:1;background:transparent;color:#d8eef1}.tabs button[aria-pressed=true]{background:#fff;color:var(--acc)}
#mic{justify-self:center;width:150px;height:150px;border-radius:50%;font-size:18px;background:radial-gradient(circle,#3fb6c4,#0b6e7a 70%);box-shadow:0 0 0 6px var(--hi)}
#mic.on{background:var(--rec);box-shadow:0 0 0 10px rgba(198,40,40,.18)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}
.err{color:var(--rec);font-weight:600}.okm{color:var(--ok);font-weight:700}
.mut{color:var(--mut);font-size:14px}
.tk{border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:12px;display:grid;gap:8px;background:#fbfeff}
.tk h3{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.tk.done{border-left-color:var(--ok);opacity:.75}.tk.ko{border-left-color:var(--rec)}
.ris{display:grid;gap:4px;max-height:280px;overflow:auto}
.ris button{text-align:left;background:#f2f8f9;color:var(--fg);font-weight:500;padding:9px 11px}
.ris button b{font-weight:700}
.sel{background:var(--hi);border-radius:10px;padding:10px;font-weight:600}
[hidden]{display:none!important}
</style></head><body><div class="w">
<header><div class="logo">📡</div><div><h1>RADAR VOCALE</h1><div class="sub" id="chi">LG GROUP · apertura ticket</div></div></header>

<section class="card" id="login">
<label for="tec">Utente</label><input id="tec" autocomplete="username" placeholder="es. Angelo">
<label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
<button id="entra">Entra</button><div class="err" id="lerr"></div>
</section>

<div id="app" hidden style="display:grid;gap:14px">
<div class="tabs" role="tablist"><button id="tV" aria-pressed="true">🎙️ A voce</button><button id="tM" aria-pressed="false">⌨️ A mano</button></div>

<section class="card" id="voce">
<button id="mic">🎙️<br>Parla</button>
<div class="mut" id="st" style="text-align:center">Puoi dettare anche più casi di fila: dì il cognome del cliente all'inizio di ogni caso, oppure «altro caso».</div>
<label for="txt">Cosa hai detto (puoi correggere)</label>
<textarea id="txt" placeholder="Es.: Rossi Mario di Bitonto perde sotto il lavello, urgente. Altro caso: Bianchi di Modugno vuole la bombola CO2."></textarea>
<button id="go">🧠 Prepara i ticket</button>
<button id="clr" class="g">🗑️ Cancella tutto e rifai</button>
</section>

<section class="card" id="mano" hidden>
<label for="q">Cerca cliente (cognome, nome, telefono o paese)</label>
<input id="q" placeholder="es. Rossi" autocomplete="off">
<div class="ris" id="ris"></div>
<button class="g" id="nuovoM">+ Cliente non in elenco</button>
</section>

<section class="card" id="res" hidden>
<div style="display:flex;justify-content:space-between;align-items:center"><b id="nT">Ticket</b><button class="g" id="add" style="padding:6px 10px">+ Aggiungi</button></div>
<div id="lista" style="display:grid;gap:10px"></div>
<button id="apri">✅ Apri i ticket nel Radar</button>
<div id="esito"></div>
</section>
<div style="text-align:center"><a href="#" id="esci" hidden style="color:#9fd3da">Esci</a></div>
</div>
</div>
<script>
var API="https://script.google.com/macros/s/AKfycbzEX0naWZOnXVdtvM6pwQTWoUsZAllz9o-y1QbANIw7KzSWoRS5Qr_34NDfKZCIlelu/exec?voce=1";
var $=function(i){return document.getElementById(i)},U=null,IDX=[],T=[];
var TIP=["CF","CF + extra","Semplice","Approfondire","Assistenza","Rifix","Installazione"];
function api(o){return fetch(API,{method:"POST",body:JSON.stringify(Object.assign({tecnico:U.tecnico,pin:U.pin},o))}).then(function(r){return r.json()})}
function n(x){return String(x||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
try{U=JSON.parse(localStorage.getItem("lg_voce_u")||"null")}catch(e){}
var QU=new URLSearchParams(location.search).get("u");if(QU&&U&&n(U.tecnico)!==n(QU))U=null;if(QU){$("tec").value=QU}
if(U){$("tec").value=U.tecnico;$("pin").value=U.pin;entra()}
$("entra").onclick=function(){U={tecnico:$("tec").value.trim(),pin:$("pin").value.trim()};entra()};
function entra(){$("lerr").textContent="Accesso…";api({a:"login"}).then(function(r){if(!r.ok){$("lerr").textContent=r.err;return}
U.nome=r.nome;try{localStorage.setItem("lg_voce_u",JSON.stringify(U))}catch(e){}$("login").hidden=true;$("app").hidden=false;$("esci").hidden=false;$("chi").textContent="Ciao "+r.nome+" · LG GROUP";
$("st").dataset.def=$("st").textContent;$("st").textContent="Carico l'elenco clienti…";api({a:"clienti"}).then(function(c){IDX=(c.L||[]).map(function(x){return {cli:x[0],tel:x[1],loc:x[2],ind:x[3],zona:x[4],impi:x[5],id:x[6],tt:x[7]||"",N:n(x[0]),T:(x[7]||"").replace(/\D/g,"")}});$("st").textContent=$("st").dataset.def}).catch(function(){$("st").textContent="Elenco clienti non caricato: i ticket si aprono lo stesso."})})
.catch(function(){$("lerr").textContent="Nessuna connessione con il Radar, riprova."})}
$("esci").onclick=function(e){e.preventDefault();try{localStorage.removeItem("lg_voce_u")}catch(x){}location.reload()};
function tab(v){$("tV").setAttribute("aria-pressed",String(v));$("tM").setAttribute("aria-pressed",String(!v));$("voce").hidden=!v;$("mano").hidden=v;if(!v)$("q").focus()}
$("tV").onclick=function(){tab(true)};$("tM").onclick=function(){tab(false)};

/* ---------- voce ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,r=null,on=false,base="";
if(!SR){$("mic").disabled=true;$("st").textContent="Questo browser non ha il riconoscimento vocale: apri con Chrome."}
$("mic").onclick=function(){if(on){r.stop();return}r=new SR();r.lang="it-IT";r.continuous=true;r.interimResults=true;base=$("txt").value.trim();
r.onresult=function(e){var f="",p="";for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)f+=e.results[i][0].transcript;else p+=e.results[i][0].transcript}if(f)base=(base+" "+f).trim();$("txt").value=(base+" "+p).trim()};
r.onstart=function(){on=true;$("mic").classList.add("on");$("mic").innerHTML="⏹<br>Stop";$("st").textContent="Ti ascolto… premi Stop quando hai finito"};
r.onerror=function(e){$("st").textContent=e.error==="not-allowed"?"Microfono non consentito: tocca il lucchetto accanto all'indirizzo e consenti il microfono.":e.error==="no-speech"?"Non ho sentito niente, riprova.":"Errore microfono: "+e.error};
r.onend=function(){on=false;$("mic").classList.remove("on");$("mic").innerHTML="🎙️<br>Parla";if(/^Ti ascolto/.test($("st").textContent))$("st").textContent=$("st").dataset.def||"";if($("txt").value.trim())prepara()};
try{r.start()}catch(x){$("st").textContent="Microfono non partito."}};
$("go").onclick=prepara;
$("clr").onclick=function(){if(on&&r){try{r.abort()}catch(x){}}base="";$("txt").value="";T=[];disegna();$("st").textContent=$("st").dataset.def||"";$("txt").focus()};

function cerca(s,lim){var S=n(s),out=[];var tel=S.replace(/\D/g,"");
IDX.forEach(function(c){var p=c.N.split(/[^A-Z]+/).filter(function(x){return x.length>=3});if(!p.length)return;var k=p.filter(function(x){return new RegExp("\\b"+x+"\\b").test(S)}).length;var sc=0;
if(k>=2)sc=k+2;else if(k===1)sc=1;if(sc&&c.loc&&S.indexOf(n(c.loc))>=0)sc+=2;if(tel.length>=8&&c.T.indexOf(tel.slice(-9))>=0)sc=99;if(sc)out.push([sc,c])});
out.sort(function(a,b){return b[0]-a[0]});return out.slice(0,lim||6)}
function tipo(TN){if(/INSTALL/.test(TN))return "Installazione";if(/RIFIX|DI NUOVO LO STESSO|RITORNARE/.test(TN))return "Rifix";if(/FILTR/.test(TN))return /PERD|MEMBRAN|GUAST|CO ?2/.test(TN)?"CF + extra":"CF";if(/CO ?2|BOMBOL|BOTTIGLI|CONSEGN|RITIR|RICAMB/.test(TN)&&!/PERD|GUAST|NON FUNZION|NON EROGA/.test(TN))return "Semplice";if(/NON SO|DA CAPIRE|STRANO|APPROFOND|VERIFICARE/.test(TN))return "Approfondire";return "Assistenza"}
function prio(TN){return /URGENT|SUBITO|ALLAGA|ACQUA DAPPERTUTTO|SENZA ACQUA|NON EROGA/.test(TN)?"A":/NON C'E FRETTA|CON CALMA|QUANDO CAPITA/.test(TN)?"C":"B"}
var FORZA=/\b(ALTRO CASO|NUOVO CASO|ALTRO TICKET|NUOVO TICKET|ALTRO CLIENTE|PROSSIMO CASO|SECONDO CASO|TERZO CASO|QUARTO CASO|QUINTO CASO|SESTO CASO|CASO NUMERO \w+|POI C'E|POI CE|POI ABBIAMO)\b/;
function prepara(){var t=$("txt").value.trim();if(!t)return;
var frasi=t.replace(/\s+/g," ").split(/(?<=[.;!?])\s+|\s+(?=(?:altro caso|nuovo caso|altro ticket|nuovo ticket|altro cliente|prossimo caso|secondo caso|terzo caso|quarto caso|quinto caso|sesto caso|caso numero|poi c'è|poi abbiamo)\b)/i).filter(function(x){return x.trim()});
var casi=[],cur=null;
frasi.forEach(function(f){var F=n(f),m=cerca(f,3),best=m[0]&&m[0][0]>=2&&(!m[1]||m[1][0]<m[0][0])?m[0][1]:null;
var nuovo=!cur||FORZA.test(F)||(best&&cur.cli&&best!==cur.cli)||(best&&!cur.cli&&cur.testo.length>0&&cerca(cur.testo,1).length===0&&false);
if(best&&cur&&!cur.cli&&!FORZA.test(F)){cur.cli=best;cur.cand=m;cur.testo+=" "+f;return}
if(nuovo){cur={testo:f.replace(/^(altro caso|nuovo caso|altro ticket|nuovo ticket|altro cliente|prossimo caso|secondo caso|terzo caso|quarto caso|quinto caso|sesto caso|caso numero \w+|poi c'è|poi abbiamo)[:,]?\s*/i,""),cli:best,cand:m};casi.push(cur)}else{cur.testo+=" "+f;if(!cur.cli&&best){cur.cli=best;cur.cand=m}}});
T=casi.map(function(c){var TN=n(c.testo),cand=(c.cand||[]).map(function(x){return x[1]});if(c.cli&&cand.indexOf(c.cli)<0)cand.unshift(c.cli);
var tel=(c.testo.replace(/(\d)\s+(?=\d)/g,"$1").match(/\b3\d{8,9}\b/)||[""])[0];
return {cand:cand,c:c.cli||null,tel:c.cli?c.cli.tel:tel,loc:c.cli?[c.cli.loc,c.cli.ind].filter(Boolean).join(", "):"",tip:tipo(TN),pri:prio(TN),des:c.testo.charAt(0).toUpperCase()+c.testo.slice(1),frase:c.testo,on:true}});
disegna();$("res").scrollIntoView({behavior:"smooth"})}

/* ---------- a mano ---------- */
$("q").oninput=function(){var v=$("q").value.trim(),L=$("ris");L.innerHTML="";if(v.length<2)return;var V=n(v).split(/\s+/).filter(Boolean),d=v.replace(/\D/g,"");
IDX.filter(function(c){return (d.length>=4&&c.T.indexOf(d)>=0)||V.every(function(w){return c.N.indexOf(w)>=0||n(c.loc).indexOf(w)>=0})}).slice(0,12).forEach(function(c){var b=document.createElement("button");b.innerHTML="<b>"+esc(c.cli)+"</b> · "+esc(c.loc||"")+(c.impi?" · "+esc(c.impi):"");b.onclick=function(){T.push({cand:[c],c:c,tel:c.tel,loc:[c.loc,c.ind].filter(Boolean).join(", "),tip:"Assistenza",pri:"B",des:"",frase:"",on:true});$("q").value="";L.innerHTML="";disegna();var x=document.querySelectorAll(".tk textarea");if(x.length)x[x.length-1].focus()};L.appendChild(b)})};
$("nuovoM").onclick=function(){T.push({cand:[],c:null,tel:"",loc:"",tip:"Assistenza",pri:"B",des:"",frase:"",on:true,libero:$("q").value.trim()});$("q").value="";$("ris").innerHTML="";disegna()};
$("add").onclick=$("nuovoM").onclick;

/* ---------- elenco ticket ---------- */
function disegna(){var L=$("lista");L.innerHTML="";$("res").hidden=!T.length;$("esito").textContent="";
T.forEach(function(k,i){var d=document.createElement("div");d.className="tk"+(k.ok?" done":k.err?" ko":"");
var opts=k.cand.map(function(c,j){return '<option value="'+j+'"'+(k.c===c?" selected":"")+'>'+esc(c.cli)+" · "+esc(c.loc||"")+'</option>'}).join("")+'<option value="-1"'+(!k.c?" selected":"")+'>Cliente non in elenco / da scrivere</option>';
d.innerHTML='<h3><span>Ticket '+(i+1)+(k.ok?" · ✅ "+esc(k.ok):"")+'</span><label style="text-transform:none;font-size:14px;color:var(--fg)"><input type="checkbox" class="on" style="width:auto"'+(k.on?" checked":"")+'> apri</label></h3>'+
'<select class="cl">'+opts+'</select><input class="nm" placeholder="Nome cliente (se non in elenco)" value="'+esc(k.libero||"")+'"'+(k.c?" hidden":"")+'>'+
'<div class="row"><input class="te" inputmode="tel" placeholder="Telefono" value="'+esc(k.tel)+'"><input class="lo" placeholder="Località" value="'+esc(k.loc)+'"></div>'+
'<div class="row"><select class="ti">'+TIP.map(function(x){return "<option"+(x===k.tip?" selected":"")+">"+x+"</option>"}).join("")+'</select><select class="pr"><option value="A"'+(k.pri==="A"?" selected":"")+'>A · urgente</option><option value="B"'+(k.pri==="B"?" selected":"")+'>B · normale</option><option value="C"'+(k.pri==="C"?" selected":"")+'>C · bassa</option></select></div>'+
'<textarea class="de" placeholder="Cosa serve">'+esc(k.des)+'</textarea>'+(k.err?'<div class="err">'+esc(k.err)+'</div>':"")+'<button class="g rm" style="padding:6px 10px;justify-self:start">Togli</button>';
var q=function(s){return d.querySelector(s)};
q(".on").onchange=function(){k.on=this.checked};
q(".cl").onchange=function(){var j=+this.value;k.c=j>=0?k.cand[j]:null;if(k.c){k.tel=k.c.tel;k.loc=[k.c.loc,k.c.ind].filter(Boolean).join(", ")}disegna()};
q(".nm").oninput=function(){k.libero=this.value};q(".te").oninput=function(){k.tel=this.value};q(".lo").oninput=function(){k.loc=this.value};
q(".ti").onchange=function(){k.tip=this.value};q(".pr").onchange=function(){k.pri=this.value};q(".de").oninput=function(){k.des=this.value};
q(".rm").onclick=function(){T.splice(i,1);disegna()};
if(k.ok)Array.prototype.forEach.call(d.querySelectorAll("input,select,textarea,button"),function(x){x.disabled=true});
L.appendChild(d)});
var da=T.filter(function(k){return k.on&&!k.ok}).length;$("nT").textContent=T.length===1?"1 ticket":T.length+" ticket";$("apri").textContent=da>1?"✅ Apri i "+da+" ticket nel Radar":"✅ Apri il ticket nel Radar";$("apri").disabled=!da}

$("apri").onclick=function(){var L=T.filter(function(k){return k.on&&!k.ok});var bad=L.filter(function(k){return !k.c&&!(k.libero||"").trim()&&!k.tel.trim()&&!k.loc.trim()});
if(bad.length){$("esito").innerHTML='<span class="err">Ogni ticket ha bisogno del cliente, oppure almeno di telefono o località.</span>';return}
if(L.some(function(k){return !k.des.trim()})){$("esito").innerHTML='<span class="err">Scrivi cosa serve in ogni ticket.</span>';return}
$("apri").disabled=true;var i=0,okN=0;$("esito").textContent="Apro i ticket…";
(function next(){if(i>=L.length){disegna();$("esito").innerHTML=okN?'<span class="okm">✅ '+okN+(okN===1?" ticket aperto":" ticket aperti")+' nel Radar</span>':'<span class="err">Nessun ticket aperto</span>';if(okN===L.length){$("txt").value="";base=""}return}
var k=L[i++];api({a:"apri",cliente:k.c?k.c.cli:(k.libero||"").trim(),telefono:k.tel.trim(),localita:k.loc.trim(),descrizione:"[VOCALE "+U.nome+"] "+k.des.trim(),tipologia:k.tip,priorita:k.pri,frase:k.frase||k.des}).then(function(x){if(x.ok){k.ok=x.id;k.err="";okN++}else k.err=x.err||"Errore";next()}).catch(function(){k.err="Nessuna connessione";next()})})()};
</script></body></html>

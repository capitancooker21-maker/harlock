<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e7a">
<title>Radar Vocale LG</title>
<style>
:root{--bg:#f2f6f8;--card:#fff;--fg:#0f2a33;--mut:#5b7076;--acc:#0b6e7a;--rec:#c62828;--ok:#2e7d32;--line:#d5e2e6}
@media (prefers-color-scheme:dark){:root{--bg:#0b161a;--card:#13232a;--fg:#e4f0f2;--mut:#93a9ae;--acc:#3fb6c4;--rec:#ef5350;--ok:#66bb6a;--line:#244048;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left));display:grid;gap:14px}
h1{font-size:22px;margin:4px 0 0}.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
label{font-size:13px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
input,select,textarea{width:100%;font:16px inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
textarea{min-height:90px}
button{font:600 16px system-ui,sans-serif;border:0;border-radius:10px;padding:12px 16px;background:var(--acc);color:#fff;cursor:pointer}
button.g{background:transparent;color:var(--fg);border:1px solid var(--line)}button:disabled{opacity:.5}
#mic{justify-self:center;width:150px;height:150px;border-radius:50%;font-size:18px}
#mic.on{background:var(--rec)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
.err{color:var(--rec);font-weight:600}.okm{color:var(--ok);font-weight:700}
[hidden]{display:none!important}
</style></head><body><div class="w">
<header><h1>📡 Radar Vocale</h1><div class="mut" id="chi">LG GROUP · apertura ticket a voce</div></header>

<section class="card" id="login">
<label for="tec">Tecnico</label><input id="tec" autocomplete="username" placeholder="es. Angelo">
<label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="current-password">
<button id="entra">Entra</button><div class="err" id="lerr"></div>
</section>

<section class="card" id="app" hidden>
<button id="mic">🎙️<br>Parla</button>
<div class="mut" id="st" style="text-align:center"></div>
<label for="txt">Cosa hai detto (puoi correggere)</label>
<textarea id="txt" placeholder="Es.: sono da Rossi Mario a Bitonto, perde sotto il lavello, serve una membrana, urgente"></textarea>
<button id="go">🧠 Prepara il ticket</button>
<button id="clr" class="g">🗑️ Cancella tutto e rifai</button>
</section>

<section class="card" id="res" hidden>
<label for="cli">Cliente</label><select id="cli"></select>
<div class="row"><div><label for="tel">Telefono</label><input id="tel" inputmode="tel"></div><div><label for="loc">Località</label><input id="loc"></div></div>
<div class="row"><div><label for="tip">Tipologia</label><select id="tip"><option>CF</option><option>CF + extra</option><option>Semplice</option><option>Approfondire</option><option selected>Assistenza</option><option>Rifix</option><option>Installazione</option></select></div>
<div><label for="pri">Priorità</label><select id="pri"><option value="A">A · urgente</option><option value="B" selected>B · normale</option><option value="C">C · bassa</option></select></div></div>
<label for="des">Descrizione per l'ufficio</label><textarea id="des"></textarea>
<button id="apri">✅ Apri ticket nel Radar</button>
<div id="esito"></div>
</section>
<div class="mut" style="text-align:center"><a href="#" id="esci" hidden>Esci</a></div>
</div>
<script>
var API="https://script.google.com/macros/s/AKfycbzEX0naWZOnXVdtvM6pwQTWoUsZAllz9o-y1QbANIw7KzSWoRS5Qr_34NDfKZCIlelu/exec?voce=1";
var $=function(i){return document.getElementById(i)},U=null,IDX=[];
function api(o){return fetch(API,{method:"POST",body:JSON.stringify(Object.assign({tecnico:U.tecnico,pin:U.pin},o))}).then(function(r){return r.json()})}
function n(x){return String(x||"").toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
try{U=JSON.parse(localStorage.getItem("lg_voce_u")||"null")}catch(e){}
if(U){$("tec").value=U.tecnico;$("pin").value=U.pin;entra()}
$("entra").onclick=function(){U={tecnico:$("tec").value.trim(),pin:$("pin").value.trim()};entra()};
function entra(){$("lerr").textContent="Accesso…";api({a:"login"}).then(function(r){if(!r.ok){$("lerr").textContent=r.err;return}
U.nome=r.nome;try{localStorage.setItem("lg_voce_u",JSON.stringify(U))}catch(e){}$("login").hidden=true;$("app").hidden=false;$("esci").hidden=false;$("chi").textContent="Ciao "+r.nome+" · premi e parla";
$("st").textContent="Carico l'elenco clienti…";api({a:"clienti"}).then(function(c){IDX=(c.L||[]).map(function(x){return {cli:x[0],tel:x[1],loc:x[2],ind:x[3],zona:x[4],impi:x[5],id:x[6],tt:x[7]||""}});$("st").textContent=""}).catch(function(){$("st").textContent="Elenco clienti non caricato: il ticket si apre lo stesso."})})
.catch(function(){$("lerr").textContent="Nessuna connessione con il Radar, riprova."})}
$("esci").onclick=function(e){e.preventDefault();try{localStorage.removeItem("lg_voce_u")}catch(x){}location.reload()};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,r=null,on=false,base="";
if(!SR){$("mic").disabled=true;$("st").textContent="Questo browser non ha il riconoscimento vocale: apri con Chrome."}
$("mic").onclick=function(){if(on){r.stop();return}r=new SR();r.lang="it-IT";r.continuous=true;r.interimResults=true;base=$("txt").value.trim();
r.onresult=function(e){var f="",p="";for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)f+=e.results[i][0].transcript;else p+=e.results[i][0].transcript}if(f)base=(base+" "+f).trim();$("txt").value=(base+" "+p).trim()};
r.onstart=function(){on=true;$("mic").classList.add("on");$("mic").innerHTML="⏹<br>Stop";$("st").textContent="Ti ascolto… premi Stop quando hai finito"};
r.onerror=function(e){$("st").textContent=e.error==="not-allowed"?"Microfono non consentito: tocca il lucchetto accanto all'indirizzo e consenti il microfono.":e.error==="no-speech"?"Non ho sentito niente, riprova.":"Errore microfono: "+e.error};
r.onend=function(){on=false;$("mic").classList.remove("on");$("mic").innerHTML="🎙️<br>Parla";if(/^Ti ascolto/.test($("st").textContent))$("st").textContent="";if($("txt").value.trim())prepara()};
try{r.start()}catch(x){$("st").textContent="Microfono non partito."}};
$("go").onclick=prepara;
$("clr").onclick=function(){if(on&&r){try{r.abort()}catch(x){}}base="";$("txt").value="";$("res").hidden=true;$("esito").textContent="";$("st").textContent="";$("cli").innerHTML="";$("des").value="";$("txt").focus()};
function prepara(){var t=$("txt").value.trim();if(!t)return;var TN=n(t);
var sc=IDX.map(function(c){var p=n(c.cli).split(/[^A-Z]+/).filter(function(x){return x.length>=3});var k=p.filter(function(x){return new RegExp("\\b"+x+"\\b").test(TN)}).length;var s=k>=2?k+1:(k===1&&p.length===1?1:0);if(s&&c.loc&&TN.indexOf(n(c.loc))>=0)s+=2;return [s,c]}).filter(function(x){return x[0]>0}).sort(function(a,b){return b[0]-a[0]}).slice(0,6);
var tel=(t.replace(/(\d)\s+(?=\d)/g,"$1").match(/\b3\d{8,9}\b/)||[""])[0];if(tel){IDX.filter(function(c){return c.tt.indexOf(tel.slice(-9))>=0}).forEach(function(c){sc.unshift([99,c])})}
var s=$("cli");s.innerHTML="";sc.forEach(function(x){var o=document.createElement("option");o.value=IDX.indexOf(x[1]);o.textContent=x[1].cli+" · "+(x[1].loc||"")+(x[1].impi?" · "+x[1].impi:"");s.appendChild(o)});
var o=document.createElement("option");o.value="-1";o.textContent=sc.length?"Nessuno di questi (cliente non in elenco)":"⚠️ Cliente non riconosciuto: scrivi telefono o località";s.appendChild(o);s.onchange=fill;fill();
var tp="Assistenza";if(/INSTALL/.test(TN))tp="Installazione";else if(/RIFIX|RITORNARE PER LO STESSO|DI NUOVO LO STESSO/.test(TN))tp="Rifix";else if(/FILTR/.test(TN))tp=/PERD|MEMBRAN|GUAST|CO ?2/.test(TN)?"CF + extra":"CF";else if(/CO ?2|BOMBOL|BOTTIGLI|CONSEGN|RITIR|RICAMB/.test(TN)&&!/PERD|GUAST|NON FUNZION/.test(TN))tp="Semplice";else if(/NON SO|DA CAPIRE|STRANO|APPROFOND/.test(TN))tp="Approfondire";$("tip").value=tp;
$("pri").value=/URGENT|SUBITO|ALLAGA|ACQUA DAPPERTUTTO|SENZA ACQUA/.test(TN)?"A":/NON C'E FRETTA|CON CALMA|QUANDO CAPITA/.test(TN)?"C":"B";
$("des").value=t.charAt(0).toUpperCase()+t.slice(1);$("esito").textContent="";$("apri").disabled=false;$("res").hidden=false;$("res").scrollIntoView({behavior:"smooth"})}
function fill(){var c=IDX[+$("cli").value];$("tel").value=c?c.tel:"";$("loc").value=c?[c.loc,c.ind].filter(Boolean).join(", "):""}
$("apri").onclick=function(){var c=IDX[+$("cli").value],t=$("txt").value.trim();if(!c&&!$("tel").value.trim()&&!$("loc").value.trim()){$("esito").innerHTML='<span class="err">Scegli il cliente o scrivi almeno telefono o località.</span>';return}
$("apri").disabled=true;$("esito").textContent="Apro il ticket…";
api({a:"apri",cliente:c?c.cli:"",telefono:$("tel").value.trim(),localita:$("loc").value.trim(),descrizione:"[VOCALE "+U.nome+"] "+$("des").value.trim(),tipologia:$("tip").value,priorita:$("pri").value,frase:t}).then(function(x){
if(x.ok){$("esito").innerHTML='<span class="okm">✅ Ticket '+x.id+' aperto nel Radar'+(x.collegato?" e collegato al cliente":"")+'</span>';$("txt").value="";}else{$("apri").disabled=false;$("esito").innerHTML='<span class="err">'+(x.err||"Errore")+'</span>'}})
.catch(function(){$("apri").disabled=false;$("esito").innerHTML='<span class="err">Nessuna connessione: riprova.</span>'})};
</script></body></html>
